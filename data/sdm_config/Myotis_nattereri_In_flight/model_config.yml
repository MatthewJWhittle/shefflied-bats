model:
  maxent:
    feature_types:
    - linear
    beta_multiplier: 2.0
    beta_lqp: 0.53
    beta_hinge: 3.8
    beta_threshold: 0.58
    beta_categorical: 0.51
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
