model:
  maxent:
    feature_types:
    - linear
    beta_multiplier: 4.12
    beta_lqp: 5.8
    beta_hinge: 4.0
    beta_threshold: 1.34
    beta_categorical: 0.27
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
