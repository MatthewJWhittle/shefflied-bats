model:
  maxent:
    feature_types:
    - linear
    - hinge
    beta_multiplier: 3.0
    beta_lqp: 0.60
    beta_hinge: 1.65
    beta_threshold: 0.49
    beta_categorical: 0.20
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
