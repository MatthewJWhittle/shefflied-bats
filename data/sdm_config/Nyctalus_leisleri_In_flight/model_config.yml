model:
  maxent:
    feature_types:
    - linear
    - quadratic
    beta_multiplier: 4.4
    beta_lqp: 4.69
    beta_hinge: 0.96
    beta_threshold: 2.74
    beta_categorical: 0.18
    n_hinge_features: 0
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
