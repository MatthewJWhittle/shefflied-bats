model:
  maxent:
    feature_types:
    - linear
    - quadratic
    beta_multiplier: 8.5
    beta_lqp: 1.0
    beta_hinge: 0.5
    beta_threshold: 1.8
    beta_categorical: 0.6
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
