model:
  maxent:
    feature_types:
    - linear
    - quadratic
    beta_multiplier: 2
    beta_lqp: 4.5
    beta_hinge: 3.3
    beta_threshold: 1.9
    beta_categorical: 0.4
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
