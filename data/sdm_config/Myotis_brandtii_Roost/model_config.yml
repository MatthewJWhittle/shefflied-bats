model:
  maxent:
    feature_types:
    - linear
    - hinge
    beta_multiplier: 6.0
    beta_lqp: 0.15
    beta_hinge: 1.5
    beta_threshold: 4.6
    beta_categorical: 0.1
    n_hinge_features: 11
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
