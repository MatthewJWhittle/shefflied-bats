model:
  maxent:
    feature_types:
    - linear
    - hinge
    beta_multiplier: 8.6
    beta_lqp: 0.52
    beta_hinge: 1.78
    beta_threshold: 0.29
    beta_categorical: 0.99
    n_hinge_features: 15
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
