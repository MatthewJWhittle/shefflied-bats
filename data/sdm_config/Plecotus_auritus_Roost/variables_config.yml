# Brown long-eared bat (Plecotus auritus) roost model: environmental layers.
#
# Layers removed from the previous set, and why (correlations are over the
# presence and background points used in training):
# - ceh_landcover_coniferous_woodland, ceh_landcover_coniferous_woodland_500m:
#   no published roost evidence for conifer cover; roost studies point to
#   broadleaved woodland. Low overlap with kept layers and little used by the
#   previous model, so the drop rests on ecology, not redundancy.
# - ceh_landcover_suburban (in-cell): overlaps in-cell building cover
#   (r = 0.85) and works at too fine a scale: it scores heavily suburban cells
#   highest, which tracks where surveys happen rather than where bats roost.
# - ceh_landcover_urban_500m: overlaps urban cover within 1.5 km (r = 0.87),
#   the scale at which avoidance of built-up land has been measured.
#
# One-change restore (1 Nov 2026) — reason before the edit:
# - ceh_landcover_suburban_500m: put back. Specialists avoid small towns /
#   suburban fabric at this neighbourhood scale; Sep25-on-main SHAP showed a
#   falling response at 6.9% mean |SHAP| (see store docs/ble-roost-shap-
#   sep25-vs-main.md). The earlier drop treated it as redundant with
#   buildings + urban 1.5 km; this restore tests the neighbourhood-scale
#   avoidance signal alone (no other layer changes).
#
# Layers added:
# - ceh_landcover_broadleaved_woodland_500m: roosts sit close to broadleaved
#   woodland (Boughey et al. 2011; Bellamy & Altringham 2015).
# - ceh_landcover_urban_1500m: avoidance of built-up land around roosts,
#   at the 1.5 km scale used by Bellamy & Altringham 2015.
# - vom_vegetation_height_std (put back): variability of vegetation height,
#   a measure of canopy structure that picks out edges and tree-shrub mix.
#   It tracks mean vegetation height closely in rank order (Spearman 0.99,
#   Pearson 0.87) but adds edge structure. Putting it back raised held-out
#   AUC on all four seeds and kept urban hotspot counts close to the
#   11-layer set.
# ALAN (`alan_viirs_radiance`, #37) is not enabled here yet — species
# wiring is a separate second pass (Matt, 24 Oct 2026).
variables:
- os_distance_distance_to_minor_roads
- terrain_stats_slope
- os_distance_distance_to_major_roads
- ceh_landcover_arable_1000m
- vom_vegetation_height_mean
- os_cover_buildings
- ceh_landcover_grassland_1000m
- climate_bioclim_bio_2
- climate_stats_temp_ann_avg
- ceh_landcover_broadleaved_woodland_500m
- ceh_landcover_urban_1500m
- vom_vegetation_height_std  # canopy structural variability: edges, tree-shrub mix
- ceh_landcover_suburban_500m  # neighbourhood-scale avoidance of small-town / suburban fabric
