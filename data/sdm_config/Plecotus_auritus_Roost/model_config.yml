model:
  maxent:
    feature_types:
    - linear
    - hinge
    beta_multiplier: 3.33
    beta_lqp: 0.19
    beta_hinge: 1.41
    beta_threshold: 0.15
    beta_categorical: 0.10
    n_hinge_features: 14
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
