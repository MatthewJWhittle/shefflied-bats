model:
  maxent:
    feature_types:
    - linear
    - hinge
    - threshold
    beta_multiplier: 7.95485250937788
    beta_lqp: 2.166574668321673
    beta_hinge: 0.23036988667610747
    beta_threshold: 0.25297121752280316
    beta_categorical: 0.6197389293063843
    n_hinge_features: 20
    n_threshold_features: 7
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
