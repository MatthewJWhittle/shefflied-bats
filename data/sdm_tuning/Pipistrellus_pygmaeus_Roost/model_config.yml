model:
  maxent:
    feature_types:
    - hinge
    - linear
    beta_multiplier: 2.1
    beta_lqp: 0.9
    beta_hinge: 1.7000000000000002
    beta_threshold: 1.1
    beta_categorical: 1.7000000000000002
    n_hinge_features: 10
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
