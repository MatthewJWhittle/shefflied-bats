model:
  maxent:
    feature_types:
    - hinge
    - linear
    beta_multiplier: 3.9000000000000004
    beta_lqp: 2.3
    beta_hinge: 2.3
    beta_threshold: 1.3
    beta_categorical: 2.1
    n_hinge_features: 15
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
