model:
  maxent:
    feature_types:
    - hinge
    - linear
    - threshold
    beta_multiplier: 4.171318102830459
    beta_lqp: 1.4953124128950794
    beta_hinge: 0.9946487152330584
    beta_threshold: 4.004465262661662
    beta_categorical: 0.7604230789327032
    n_hinge_features: 10
    n_threshold_features: 2
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
