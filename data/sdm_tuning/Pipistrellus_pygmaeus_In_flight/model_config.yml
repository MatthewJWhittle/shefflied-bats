model:
  maxent:
    feature_types:
    - linear
    - product
    beta_multiplier: 4.5
    beta_lqp: 2.1
    beta_hinge: 3.4000000000000004
    beta_threshold: 1.9
    beta_categorical: 0.5
    n_hinge_features: 0
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
