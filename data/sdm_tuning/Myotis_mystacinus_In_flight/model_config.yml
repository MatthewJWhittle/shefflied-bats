model:
  maxent:
    feature_types:
    - hinge
    - linear
    beta_multiplier: 4.800000000000001
    beta_lqp: 1.0
    beta_hinge: 3.6
    beta_threshold: 1.6
    beta_categorical: 2.1
    n_hinge_features: 11
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
