model:
  maxent:
    feature_types:
    - linear
    beta_multiplier: 3.1
    beta_lqp: 1.4
    beta_hinge: 1.6
    beta_threshold: 2.2
    beta_categorical: 3.0
    n_hinge_features: 0
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
