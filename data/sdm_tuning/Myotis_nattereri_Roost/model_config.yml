model:
  maxent:
    feature_types:
    - linear
    beta_multiplier: 1.4
    beta_lqp: 2.1
    beta_hinge: 1.5
    beta_threshold: 1.3
    beta_categorical: 1.8
    n_hinge_features: 0
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
