model:
  maxent:
    feature_types:
    - hinge
    - linear
    - product
    beta_multiplier: 1.7000000000000002
    beta_lqp: 2.0
    beta_hinge: 1.9
    beta_threshold: 1.9
    beta_categorical: 2.6
    n_hinge_features: 11
    n_threshold_features: 0
    clamp: true
    tau: 0.5
    transform: cloglog
    convergence_tolerance: 1.0e-05
    use_lambdas: best
    n_lambdas: 100
    class_weights: balanced
