# Species Distribution Modelling Configuration

# Data paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "data/sdm_models"
  tuning_dir: "data/sdm_tuning"
  config_dir: "data/sdm_config"
  predictions: "data/sdm_predictions"
  model_config: "model_config.yml"
  variables_config: "variables_config.yml"
  occurence_data: "data/processed/bats-tidy.geojson"
  background_points: "data/processed/background-points.geojson"
  boundary: "data/processed/boundary.geojson"
  grid_points: "data/evs/grid-points.parquet"
  evs: "data/processed/evs"
  ev_tiff: "data/evs/evs-to-model.tif"

# Spatial configuration
spatial:
  top: 646900
  left: 313000
  crs: "EPSG:27700"
  resolution: 100
  # Applied once by `sdm setup` (buffer ∩ ONS BFC land) into paths.boundary.
  # EV builders load that file with no extra buffer.
  study_area_buffer: 7000

# Coordinate reference system
crs: "EPSG:27700" # OSGB1936 / British National Grid

# Post-merge model EV stack (sdm data → evs-to-model.tif).
# Layer clipping default ON follows the architecture review; disabling is out of
# scope for #38. Limits are also copied into rebuild_metrics.json as build_settings.
ev_stack:
  selected_variables_csv: "data/ev_clusters_selected.csv"
  multiscale:
    groups:
      - ceh_landcover
      - os_cover_water
      - vom_vegetation_height
    windows_cells: [10, 20, 30]
    resolution_m: 100
  layer_clipping:
    enabled: true
    layers:
      bgs_coast_distance_to_coast:
        min: 0
        max: 7000
      os_distance_distance_to_buildings:
        min: 0
        max: 7000
      os_distance_distance_to_major_roads:
        min: 0
        max: 7000
      terrain_stats_curvature:
        quantile_min: 0.05
        quantile_max: 0.95
      # #73: cap VOM height bands (masts/pylons); std left unclipped
      vom_vegetation_height_max:
        min: 0
        max: 40
      vom_vegetation_height_mean:
        min: 0
        max: 40
      vom_vegetation_height_min:
        min: 0
        max: 40

# MLflow run tracking (#93). Secrets and connection details live in the
# gitignored mlflow.settings.yml (see mlflow.settings.example.yml). Tracking
# stays off until that file is filled in and cloud resources are approved.
mlflow:
  enabled: false
  settings_file: "mlflow.settings.yml"
  experiment_name: "species_sdm_experiment"

# Versioned prediction publish (`sdm predict --publish`). Library code has no
# project bucket default: set root here, or pass --publish-root / PREDICTION_PUBLISH_ROOT.
# Publish file names come from each model's full Latin name (snake case) + behaviour;
# there is no short-name → Latin translation map.
prediction_publish:
  root: "gs://habitat-suitability-modelling-data/predictions"

# Global background defaults for `sdm train` (overridden by model_config.yml
# `model.background`, then by CLI). Values match today's live-train behaviour.
# Trial packaging: model_config.background-as-drawn.yml (#103).
# See docs/background-points.md.
background:
  n_background_points: 8000
  surface: all_bat
  background_method: contrast
  background_value: 0.025
  sigma: 6.5
  transform_method: presence
  presence_exclusion_m: 500
  background_thin_m: 2000
  presence_thin_m: 2000
  cap_ratio: 10
  min_background: null
  max_background: null
  distance_weights: true
  background_distance_weights: true
  sample_weight_n_neighbors: 10
  class_balance: true
