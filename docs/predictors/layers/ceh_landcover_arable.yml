id: ceh_landcover_arable
title: Arable cover (in-cell)
kind: source
family: landcover
summary: >-
  Area of UKCEH LCM 2023 class Arable (code 3) aggregated to each 100 m model cell (percent
  × 100 units).
shows:
- How much of the 100 m cell is mapped as arable in LCM 2023
does_not_show:
- Habitat quality or management
- Neighbourhood context (see *_500m / *_1000m / *_1500m derivatives)
units: 0–10000 (percent × 100)
native_resolution_m: 10.0
model_resolution_m: 100.0
crs: EPSG:27700
temporal:
  label: UKCEH Land Cover Map 2023
source_id: ukceh_lcm_2023
pipeline:
  rebuild_step: ceh
  code: sdm/commands/data_preparation/environmental/generate_ceh_lc_data.py
processing:
- Manual CEH 10 m GeoTIFF path
- Per-class / aggregated area to 100 m cells
- Merge prefix ceh_landcover_
caveats:
- Classification error and mixed pixels at 10 m propagate into cell shares
- 'Class definition: UKCEH LCM 2023 class Arable (code 3)'
references:
- title: UKCEH Land Cover Maps
  url: https://www.ceh.ac.uk/data/ukceh-land-cover-maps
markdown: ceh_landcover_arable.md
