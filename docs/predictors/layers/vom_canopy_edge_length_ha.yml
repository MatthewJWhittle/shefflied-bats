id: vom_canopy_edge_length_ha
title: Canopy edge length per hectare
kind: source
family: vegetation
summary: >
  Length of canopy / non-canopy edge (1 m edge pixels) expressed per hectare in each 100 m cell.
shows:
  - Edge density of VOM canopy within the cell
does_not_show:
  - Woodland-edge distance to a mapped polygon inventory
units: "metres per hectare"
native_resolution_m: 1
model_resolution_m: 100
crs: EPSG:27700
temporal:
  label: National LiDAR Programme surveys (winter / leaf-off)
  notes: >
    VOM is derived from National LiDAR Programme elevation; Phase 1 blocks were
    captured in winter months (approx. November–April) between 2017 and 2023.
source_id: ea_vom
pipeline:
  rebuild_step: vom_canopy
  code: sdm/commands/data_preparation/environmental/generate_vom_canopy_features.py
processing:
  - Canopy edge pixels (4-connected)
  - Count × 1 m / cell hectares
caveats:
  - Official VOM product keeps only classified vegetation objects above 2.5 m (data.gov.uk VOM summary)
  - Each VOM pixel is height of the top of canopy above ground — not vertical canopy layering
  - National LiDAR Programme surveys used for VOM were flown in winter (leaf-off); trimmed hedges and understorey below the threshold or without winter returns are missed or under-represented
  - Automated classification can mis-label some non-vegetation objects
  - Patch classes (woodland / linear / trees-outside-woodland) are derived from canopy geometry alone — no CEH or OS land-cover labels
  - Stage-one layers are written under vom_canopy/ via --only vom_canopy; they are not selected into the live EV model stack yet
references:
  - title: LIDAR Vegetation Object Model (VOM) — data.gov.uk
    url: https://www.data.gov.uk/dataset/227ab487-e8f2-4cbb-b26a-9e6d3b662265/lidar-vegetation-object-model-vom
  - title: National LIDAR Programme (winter capture window)
    url: https://environment.data.gov.uk/dataset/2e8d0733-4f43-48b4-9e51-631c25d1b0a9
markdown: vom_canopy_edge_length_ha.md
