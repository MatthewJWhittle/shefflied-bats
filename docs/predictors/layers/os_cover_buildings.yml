id: os_cover_buildings
title: Building cover
kind: source
family: os
selection: included
summary: Percentage of each 100 m cell covered by Ordnance Survey Vector Map District buildings
  features.
shows:
- In-cell building footprint cover (%) from OS VMD Building
does_not_show:
- Feature height, age, or use
- Objects absent from VMD generalisation
units: percent
model_resolution_m: 100.0
crs: EPSG:27700
source:
  provider: Ordnance Survey
  product: OS Vector Map District — Buildings
  licence: OGL-UK-3.0
  licence_url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  access_url: https://osdatahub.os.uk/downloads/open/VectorMapDistrict
  citation: Contains OS data © Crown copyright and database right
pipeline:
  rebuild_step: os
  code: sdm/commands/data_preparation/processing/process_os_data.py
processing:
- Vector features rasterised to cell cover on the model grid
caveats:
- VMD geometry is generalised; small features may be omitted
references:
- title: OS VectorMap District
  url: https://osdatahub.os.uk/downloads/open/VectorMapDistrict
markdown: os_cover_buildings.md
