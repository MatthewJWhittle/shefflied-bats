# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  # Any base (incl. stacked drafts) — do not pin a branch name.
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Blocks committed secrets (e.g. a mistyped mlflow.settings.yml). No hand-rolled scanner.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
        
    - name: Setup uv
      uses: andgineer/uv-venv@v3

    - name: Install dependencies
      run: uv sync --all-groups
      
          
    - name: Test with pytest
      run: |
        # Exclude live WCS/integration tests — they depend on external services and flake in CI.
        uv run pytest -m "not integration"

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx flake8 sdm tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx flake8 sdm tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Optional DeepMaxent / PyTorch path — base job above must not require torch.
  deepmaxent:
    name: deepmaxent (dl extra)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
    - name: Setup uv
      uses: andgineer/uv-venv@v3
    - name: Install dependencies with dl extra
      run: uv sync --all-groups --extra dl
    - name: DeepMaxent synthetic tests (CPU)
      run: uv run pytest tests/test_deepmaxent.py -m "not integration"
