model:
  seed: 42
  record_age_years: 20

  # Trainer: maxent (elapid, default) or experimental deepmaxent (joint MLP).
  # deepmaxent requires: uv sync --extra dl
  type: maxent

  # Cross-validation fold method (default: 10 km spatial blocks into 5 folds).
  # CLI overrides: --cv-method, --cv-n-folds, --cv-block-size-m,
  # --cv-block-n-folds, --cv-buffer-m, --cv-buffered-loo-warn-above.
  # See docs/cv-folds.md.
  cv:
    method: blocks
    n_folds: 3
    # seed: null  # defaults to model.seed
    block_size_m: 10000
    block_n_folds: 5
    block_n_tries: 500
    buffer_m: 10000
    buffered_loo_warn_above: 25

  # Shared multi-output DeepMaxent (Ryckewaert et al. 2024). Ignored unless
  # model.type is deepmaxent. Device auto = MPS → CUDA → CPU.
  deepmaxent:
    device: auto
    hidden_size: 250
    n_hidden_layers: 2
    dropout: 0.0
    learning_rate: 0.0002
    batch_size: 250
    weight_decay: 0.0003
    epochs: 100
    n_seeds: 10
    epsilon: 1.0e-6
    use_species_weights: false
    transform: cloglog
    # early_stopping_patience: null

  maxent:
    feature_types:
      - "linear"
      - "hinge"
    beta_multiplier: 3.0
    beta_lqp: 1.0
    beta_hinge: 1.0
    beta_threshold: 1.0
    beta_categorical: 1.0
    n_hinge_features: 10
    n_threshold_features: 10
    clamp: true
    convergence_tolerance: 1.0e-5
    use_lambdas: "best"
    n_lambdas: 100
    class_weights: "balanced"
    tau: 0.5
    transform: "cloglog"

  sampling:
    min_presence: 15
    subset_occurrence: null
    subset_background: false
    order_by_density_for_subset: true
    sample_weight_n_neighbors: 5
    grid_size_m: 2000
    background:
      factor: 10
      min_bg: 1000
      max_bg: 10000

  background:
    n_background_points: 8000
    background_method: "contrast"
    background_value: 0.025
    sigma: 6.5
    transform_method: "presence"


