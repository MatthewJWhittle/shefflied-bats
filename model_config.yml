model:
  seed: 42
  record_age_years: 20

  # Cross-validation fold method (default: 10 km spatial blocks into 5 folds).
  # CLI overrides: --cv-method, --cv-n-folds, --cv-block-size-m,
  # --cv-block-n-folds, --cv-buffer-m, --cv-buffered-loo-warn-above.
  # See docs/cv-folds.md.
  cv:
    method: blocks
    n_folds: 3
    # seed: null  # defaults to model.seed
    block_size_m: 10000
    block_n_folds: 5
    block_n_tries: 500
    buffer_m: 10000
    buffered_loo_warn_above: 25

  maxent:
    feature_types:
      - "linear"
      - "hinge"
    beta_multiplier: 3.0
    beta_lqp: 1.0
    beta_hinge: 1.0
    beta_threshold: 1.0
    beta_categorical: 1.0
    n_hinge_features: 10
    n_threshold_features: 10
    clamp: true
    convergence_tolerance: 1.0e-5
    use_lambdas: "best"
    n_lambdas: 100
    class_weights: "balanced"
    tau: 0.5
    transform: "cloglog"

  sampling:
    min_presence: 15
    subset_occurrence: null
    subset_background: false
    order_by_density_for_subset: true
    # Deprecated for live train: use background.sample_weight_n_neighbors.
    sample_weight_n_neighbors: 10
    # Deprecated for live train: use background.presence_thin_m /
    # background.background_thin_m (fallback when those are unset).
    grid_size_m: 2000
    # Legacy absolute caps for older helpers only; live train uses
    # background.cap_ratio / min_background / max_background.
    background:
      factor: 10
      min_bg: 1000
      max_bg: 10000

  # Live-train background knobs (defaults = today's behaviour).
  # Global defaults may also live under config.yml `background:`;
  # this block overrides those. CLI flags override both.
  # Trial packaging: model_config.background-as-drawn.yml (#103).
  # See docs/background-points.md.
  background:
    n_background_points: 8000
    surface: all_bat
    background_method: "contrast"
    background_value: 0.025
    sigma: 6.5
    transform_method: "presence"
    presence_exclusion_m: 500
    background_thin_m: 2000
    presence_thin_m: 2000
    cap_ratio: 10
    min_background: null
    max_background: null
    distance_weights: true
    background_distance_weights: true
    sample_weight_n_neighbors: 10
    class_balance: true
